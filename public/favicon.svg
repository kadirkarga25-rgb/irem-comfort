<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512" fill="none">
  <!-- Outer Circle Ring with Top-Right Gap in Brand Navy Blue -->
  <path
    d="M 160 52 A 78 78 0 1 1 118 25"
    stroke="#082C6C"
    stroke-width="12"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Inside Glyph Group - 'i' and 'c' centered inside the ring -->
  <g fill="#082C6C">
    <!-- Letter 'i' - Top Dot -->
    <circle cx="68" cy="68" r="8.5" />

    <!-- Letter 'i' - Vertical Stem -->
    <rect x="61" y="88" width="14" height="48" rx="3.5" />

    <!-- Letter 'c' - Lowercase Arc -->
    <path
      d="M 131 92 A 23 23 0 1 0 131 132"
      stroke="#082C6C"
      stroke-width="13"
      stroke-linecap="round"
      fill="none"
    />
  </g>
</svg>
